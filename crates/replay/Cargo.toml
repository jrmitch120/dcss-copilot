[package]
name = "copilot-replay"
description = "Recording format, in-process replayer and fake-extension front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
copilot-core.workspace = true
copilot-gk.workspace = true
copilot-store.workspace = true
copilot-webtiles.workspace = true
# The fake extension's websocket client, the same stack as the app's relay.
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pins corpus games by hash. Already in the lockfile through Tauri.
sha2 = "0.11"
thiserror.workspace = true
# Scenario and corpus manifests are hand-written, with comments: TOML, already in the lockfile
# through Tauri.
toml = "1"
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "time"] }
tokio-tungstenite.workspace = true
zstd.workspace = true

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
# To break a saved game in tests, as another version of the app or a failing disk would.
rusqlite.workspace = true
tempfile = "3"
serde_json.workspace = true
