description = "A Naga Berserker enters wizard mode on turn 0 of a seeded game, maps D:1, blinks into the room south of where they start and turns the floor there into a down staircase, blinks seven squares west, creates a goblin beside them, blinks three squares back east and reads the mutations screen. Four steps from the staircase, with the goblin five moves from beside it, a player at standard speed would take it first, but a naga's tail slows their moves to 14: the goblin, faster than them, cuts off every staircase"
recording = "naga-is-cut-off-by-a-goblin.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0]

[setup]
rc = """
combo = NaBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command: map the level.
  "&", "wiz\r", "{",
  # Blink three squares south, into the room.
  "&", "b", "j", "j", "j", ".",
  # Make a down staircase on the square they stand on.
  "&", ".",
  # Blink seven squares west.
  "&", "b", "h", "h", "h", "h", "h", "h", "h", ".",
  # Create a goblin by name beside them: it is made just east of them.
  "&", "m", "goblin\r",
  # Blink back east past it, landing three squares east of where they stood.
  "&", "b", "l", "l", ".",
  "\u001b",
  # Read the mutations screen, which shows the naga's tail.
  "A", "\u001b",
]
