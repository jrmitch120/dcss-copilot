description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game and creates a patch of fungi, a toadstool and a plant beside them on D:1, then two jackals: the panel lists the jackals once, as a pair, and leaves the firewood out"
recording = "jackals-among-fungi.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0]

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Create monsters by name beside the Minotaur: three fungi, a toadstool and a plant.
  "m", "fungus\r",
  "&", "m", "fungus\r",
  "&", "m", "fungus\r",
  "&", "m", "toadstool\r",
  "&", "m", "plant\r",
  # Then two jackals.
  "&", "m", "jackal\r",
  "&", "m", "jackal\r",
]
