description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game and creates a profane servitor beside them on D:1, whose umbra hides them"
recording = "profane-servitor-shadows-a-new-minotaur.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0]

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Create a monster by name: a profane servitor, whose umbra reaches five squares.
  "m", "profane servitor\r",
  # Wait a turn.
  ".",
]

[[alerts]]
turn = 0
cause = "threat-level-rose"

[[alerts]]
turn = 1
cause = "last-way-out-lost"
