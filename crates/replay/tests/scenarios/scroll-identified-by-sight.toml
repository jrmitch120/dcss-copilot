description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game, creates a scroll of teleportation and picks it up unidentified, creates a jackal beside them and waits a turn, then creates an identified scroll of teleportation at their feet, which tells them what the one they carry is without crawl resending it"
recording = "scroll-identified-by-sight.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [1]       # carrying the scroll unidentified, the jackal beside them

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command: none.
  "&", "wiz\r", "\u001b",
  # Create a scroll of teleportation at their feet, unidentified, and pick it up.
  "&", "%", "scroll of teleportation\r",
  ",", "\u001b",
  # Create a monster by name beside them, for the panel to list the Ways Out: a jackal.
  "&", "m", "jackal\r", "\u001b",
  # Wait a turn.
  "s", "\u001b",
  # Create an identified scroll of teleportation at their feet ("pre_id"), which they see.
  "&", "%", "pre_id scroll of teleportation\r",
  # Wait a turn.
  "s", "\u001b",
]
