description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game, rises to XL 14, creates a centaur with a +4 longbow of flaming beside them on D:1, blinks away from it and shouts to wake it: crawl lists the bow as the centaur comes into view, and the Threat Level plays it, with its plus and brand, in place of the bows crawl may make a centaur with"
recording = "centaur-shoots-a-flaming-longbow.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0, 1]

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Set the experience level to 14, for the hit points to survive arrows.
  "l", "14\r",
  # Create a monster by MONS spec: a centaur with a +4 longbow of flaming.
  "&", "m", "centaur ; longbow ego:flaming plus:4\r",
  # Blink, moving the target five squares west, then confirming it.
  "&", "b", "h", "h", "h", "h", "h", ".",
  # Shout, to wake it: crawl makes it asleep.
  "\u001b", "t", "t",
  # Wait two turns while it acts; Escape clears any --more--.
  "\u001b", ".", "\u001b", ".",
]
