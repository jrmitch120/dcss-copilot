description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game and creates an ogre beside them on D:1, which swings at them on turn 2"
recording = "ogre-beside-a-new-minotaur.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0]

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Create a monster by name: an ogre.
  "m", "ogre\r",
  # Wait two turns for it to close in.
  ".", ".",
]
