description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game and creates an orc wizard beside them on D:1, a caster of Magic Dart and Throw Flame that may cast at them before their next action"
recording = "orc-wizard-beside-a-new-minotaur.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0, 1]

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Create a monster by name: an orc wizard.
  "m", "orc wizard\r",
  # Wait two turns while it acts.
  ".", ".",
]

[[alerts]]
turn = 0
cause = "last-way-out-lost"

[[alerts]]
turn = 1
cause = "out-of-depth"
