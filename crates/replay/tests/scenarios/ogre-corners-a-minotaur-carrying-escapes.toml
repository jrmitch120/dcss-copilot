description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game, makes and picks up a scroll of teleportation and a potion of heal wounds, identifies them and creates an ogre on D:1, which closes in and hits them on turn 6: cornered at full health, when crawl greys the potion out, the scroll is their best escape; once hit, the potion heals them out of it"
recording = "ogre-corners-a-minotaur-carrying-escapes.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [5, 6]   # hit as turn 5 ends, and the turn after

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Make an item by name where they stand, then pick it up: a scroll of teleportation.
  "%", "scroll of teleportation\r", "\u001b", ",",
  # And a potion of heal wounds.
  "&", "%", "potion of heal wounds\r", "\u001b", ",",
  # Identify everything carried.
  "&", "y", "\u001b",
  # Create a monster by name beside them: an ogre.
  "&", "m", "ogre\r",
  # Wait while it closes in and swings; Escape clears any --more--.
  ".", "\u001b", ".", "\u001b", ".", "\u001b", ".", "\u001b", ".", "\u001b",
]

[[alerts]]
turn = 5
cause = "threat-level-rose"

[[alerts]]
turn = 6
cause = "hit-points-below-quarter"

[[suggested_actions]]
turn = 5
rule = "best-escape"

[[suggested_actions]]
turn = 6
rule = "heal-out-of-it"
