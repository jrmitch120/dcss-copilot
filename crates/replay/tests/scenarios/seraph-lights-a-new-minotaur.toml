description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game and creates a seraph beside them on D:1, whose halo backlights them"
recording = "seraph-lights-a-new-minotaur.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0]

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Create a monster by name: a seraph, whose halo reaches seven squares.
  "m", "seraph\r",
  # Wait a turn.
  ".",
]
