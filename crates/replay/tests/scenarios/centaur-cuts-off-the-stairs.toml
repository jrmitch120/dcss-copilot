description = "A Minotaur Berserker enters wizard mode on turn 0 of a seeded game, rises to XL 14 and maps D:1, turns the staircase out of the dungeon they start on into a down staircase, creates a centaur beside them, blinks five squares west of it and shouts to wake it: the centaur, faster than them, can be beside every staircase on the level before they take it"
recording = "centaur-cuts-off-the-stairs.dcssrec"
crawl_version = "0.34.1"
snapshot_turns = [0]

[setup]
rc = """
combo = MiBe.handaxe
game_seed = 1
"""
keys = [
  # Enter wizard mode, confirming with "wiz"; crawl then asks for a wizard command.
  "&", "wiz\r",
  # Set the experience level to 14, for the hit points to survive arrows.
  "l", "14\r",
  # Map the level, so its staircases are known.
  "&", "{",
  # Make a down staircase on the square they stand on.
  "&", ".",
  # Create a monster by name beside them: a centaur.
  "&", "m", "centaur\r",
  # Blink, moving the target five squares west, then confirming it.
  "&", "b", "h", "h", "h", "h", "h", ".",
  # Shout, to wake it: crawl makes it asleep.
  "\u001b", "t", "t",
  "\u001b",
]
