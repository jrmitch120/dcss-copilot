<!doctype html>
<!--
  PROTOTYPE, throwaway. "Setup and settings screens" (wayfinder ticket #20).
  Builds on the round3.html reference mock (prototype/visual-direction).

  Two axes:
    ?v=A|B|C     how first run and settings are shaped (keys: ← / →)
                 A  Panel-native: onboarding is a card stack inside the docked panel; settings is a drill-down sheet
                 B  Setup window: a centred wizard window with a step checklist; settings is a two-pane preferences window
                 C  Play first:   one screen to get going, everything else asked in context later; settings is one searchable page
    ?s=          which screen (key: S)   download | onboard | connect | settings
    ?c=          connection state (key: C, only on s=connect), shared by every variant
  Game data and prices are illustrative.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · DCSS Copilot · setup and settings</title>

  /* settings rows */

  .seg { display: flex; background: rgba(255,255,255,.05); border-radius: 8px; padding: 2px; }
  .seg button { padding: 3px 9px; border-radius: 6px; font-size: 11.5px; color: #8a90a3; }

  .slot { padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02); margin-top: 6px; }
  .slot .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; } .slot .sh b { font-size: 13px; }
  .slot .grid { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; font-size: 12px; align-items: center; } .slot .grid span { color: #8a90a3; }

  .tot { display: flex; gap: 6px; } .tot div { flex: 1; background: rgba(0,0,0,.3); border-radius: 8px; padding: 6px 9px; font-size: 11px; color: #8a90a3; } .tot b { display: block; color: #fff; font-size: 15px; font-variant-numeric: tabular-nums; }
  .warnline { font-size: 11.5px; color: #ffd166; margin-top: 6px; }

  /* A: sheet + drilldown */
  .sheet { position: absolute; inset: 0; background: #0c0e14; display: flex; flex-direction: column; z-index: 5; animation: rise .3s both; }
  .grp { border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); overflow: hidden; }
  .grp button.it { display: grid; grid-template-columns: 26px 1fr auto 12px; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.05); }
  .grp button.it:first-child { border-top: 0; } .grp button.it:hover { background: rgba(255,255,255,.04); }
  .grp .it i { font-style: normal; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; }

  /* B: big window */

  .win .tb i { width: 11px; height: 11px; border-radius: 50%; background: #3a3e4a; } .win .tb span { flex: 1; text-align: center; margin-right: 50px; }
  .win .in { display: grid; grid-template-columns: 230px 1fr; min-height: 0; }
  .side { background: rgba(255,255,255,.025); border-right: 1px solid rgba(255,255,255,.06); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
  .side .brand { font-weight: 700; font-size: 14px; padding: 0 8px 14px; display: flex; gap: 8px; align-items: center; }
  .side .brand i { font-style: normal; width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #ffd166, #ff8f5a); color: #111; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
  .side button { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; text-align: left; padding: 7px 8px; border-radius: 8px; font-size: 13px; color: #b9bdc9; }
  .side button:hover { background: rgba(255,255,255,.04); } .side button.on { background: rgba(255,255,255,.08); color: #fff; }
  .side button .ck { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #3a3e4a; display: grid; place-items: center; font-size: 11px; color: #111; }
  .side button.done .ck { background: #2ed573; border-color: #2ed573; } .side button.on .ck { border-color: #fff; }
  .side button small { display: block; font-size: 11px; color: #6f7588; }
  .side .grow { flex: 1; } .side .sep { height: 1px; background: rgba(255,255,255,.06); margin: 8px; } .side .gh { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #555b6c; padding: 10px 8px 4px; font-weight: 600; }
  .main { padding: 26px 30px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .main h2 { font-size: 22px; letter-spacing: -.01em; } .main h3 { font-size: 13px; color: #9aa0b2; font-weight: 600; margin-top: 6px; }

  .main .foot { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; padding-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* C: single page */

  .hint::before { content: ""; position: absolute; top: -6px; right: 52px; width: 10px; height: 10px; background: #1d2333; border-left: 1px solid rgba(116,185,255,.4); border-top: 1px solid rgba(116,185,255,.4); transform: rotate(45deg); }

<body>
<div id="root"></div>
<div id="switcher"></div>
<script>
const VARIANTS = { A: 'Panel-native', B: 'Setup window', C: 'Play first' };
const SCREENS = ['download', 'onboard', 'connect', 'settings'];
const SCREEN_NAMES = { download: 'Download page', onboard: 'First run', connect: 'Connecting', settings: 'Settings' };
const CONN = ['noext', 'allow', 'idle', 'unlisted', 'joining', 'lost', 'overflow', 'oldext', 'oldapp', 'update', 'noapp'];
const CONN_NAMES = {
  noext: 'App open, no browser yet', allow: 'Allow this browser?', idle: 'Connected, no game', unlisted: 'Unlisted server',
  joining: 'Game found', lost: 'Stream lost', overflow: 'Buffer overflowed', oldext: 'Extension too old',
  oldapp: 'App too old', update: 'Restart to update', noapp: 'App not installed',
};

const P = new URLSearchParams(location.search);
const S = {
  v: VARIANTS[P.get('v')] ? P.get('v') : 'A',
  s: SCREENS.includes(P.get('s')) ? P.get('s') : 'onboard',
  c: CONN.includes(P.get('c')) ? P.get('c') : 'noext',

          <div class="small" style="display:grid;gap:4px">
            <div class="ok">✓ CAO · webtiles · you're playing (not spectating)</div>
            <div class="ok">✓ Crawl 0.34.1 · Game Knowledge exact match</div>
            <div class="ok">✓ Resumed: game from 2 h ago (T 18,402 → 18,405)</div>
            <div class="pulse">… reading the map and inventory</div></div></div>
        <div class="tiny muted">The join card asking for <span class="mono">?#</span> and the Gaps chip are designed in “In-game secondary surfaces”.</div>${ghostPanel}</div>`; break;
    case 'lost': panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2', '<span class="tagx exp">reconnecting</span>')}<div class="body">
        <div class="card warn"><div class="lbl">Lost the game stream <em><span class="spin"></span> retrying</em></div><div class="small">The game tab closed or the connection dropped. Everything below is from <b>T 18,511</b> and frozen until the game comes back.</div>
          <div class="acts"><button class="btn">Show the game tab</button><button class="btn link">This game is over</button></div></div>${ghostPanel}</div>`; break;
    case 'overflow': panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2')}<div class="body">
        <div class="card warn"><div class="lbl">Missed part of the game</div><div class="small">The app was away long enough that the browser dropped some messages. Reload the game page (F5) to resync. Crawl saves and restores your game; nothing is lost.</div>
          <div class="acts"><button class="btn pri">Reload the game page</button></div><div class="tiny muted" style="margin-top:6px">This button asks the extension to reload the tab. It never sends keys to the game.</div></div>${ghostPanel}</div>`; break;
    case 'oldext': panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2')}<div class="body">
        <div class="card warn"><div class="lbl">Update the extension</div><div class="small">Your extension (1.0.4, relay v1) is older than this app understands (v2–v3). Browsers usually update it within a few hours.</div>
          <div class="acts"><button class="btn pri">Open chrome://extensions</button><button class="btn link">How to update now</button></div></div>${ghostPanel}</div>`; break;
    case 'oldapp': badge = true; popup = `<div class="popup rise"><h5><i>DC</i>DCSS Copilot</h5><div class="st">This extension is newer than your app. <b>Update the app</b> to keep advice running.</div><button class="btn pri" style="width:100%">Update the app</button></div>`;
      panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2')}<div class="body">
        <div class="card warn"><div class="lbl">Update the app <em><span class="spin"></span> downloading 62%</em></div><div class="small">Your extension speaks a newer relay protocol (v4). The update downloads now; restart once you're out of this game.</div>
          <div class="meter"><i style="width:62%"></i></div><div class="acts"><button class="btn">Restart now (saves your game first)</button></div></div>${ghostPanel}</div>`; break;
    case 'update': panel = `${hd('g', '<b>DCSS Copilot</b> · Chrome connected')}<div class="body">
        <div class="card"><div class="lbl">Ready <em>waiting for a game</em></div><div class="small muted">Start or resume a game in Chrome.</div></div></div>
        <div class="toast rise"><span>⬆</span><span><b>Version 1.3 is ready.</b><span class="muted small"> Better Ways Out for Lair.</span></span><span class="sp"></span><button class="btn pri">Restart to update</button><button class="btn link">Later</button></div>`; break;
    case 'unlisted': badge = true; popup = `<div class="popup rise"><h5><i>DC</i>DCSS Copilot</h5><div class="st"><b>crawl.mydomain.net</b> isn't a server we know. Let the extension read webtiles games on this site?</div>
        <button class="btn pri" style="width:100%">Enable on this site</button><div class="tiny muted" style="margin-top:8px">Your browser will ask to confirm. Only the game connection is read.</div></div>`;
      panel = `${hd('g', '<b>DCSS Copilot</b> · Chrome connected')}<div class="body"><div class="card"><div class="lbl">Ready <em>waiting for a game</em></div><div class="small muted">Playing on a private or local server? Click the extension icon and choose Enable on this site.</div></div></div>`; break;
    case 'noapp': solo = true; badge = false;
      popup = `<div class="popup rise"><h5><i>DC</i>DCSS Copilot</h5><div class="st">Couldn't reach the DCSS Copilot app on this computer.</div>
        <button class="btn pri" style="width:100%">Get DCSS Copilot</button><button class="btn link tiny" style="width:100%;margin-top:4px">It's installed: try again</button></div>`; break;
  }
  if (c !== 'noapp' && !popup && ['idle', 'joining', 'lost'].includes(c) === false && c !== 'update') { }
  const br = browser({ url: host + (inGame ? '/#play-dcss-0.34' : ''), title: inGame ? 'CAO · jrmitch' : 'CAO', page: c === 'lost' ? lobbyPage('CAO') : inGame ? gamePage() : lobbyPage('CAO'), popup, extOn: !['noext', 'noapp'].includes(c), badge });
  if (solo) return `<div class="wrap solo">${br}</div>`;
  return `<div class="wrap">${br}<div class="P">${panel}</div></div>`;
}

/* ---------- settings content (shared data, three presentations) ---------- */
const tg = (k) => `<button class="tg ${S[k] ? 'on' : ''}" onclick="set({${k}:!S.${k}})"></button>`;
const SECTIONS = [
  { id: 'assist', icon: '◐', col: '#a29bfe', t: 'Assistance', sum: () => ({ info: 'Info only', hints: 'Hints', coach: 'Coach' })[S.level], body: () => `
      <div class="row"><span><b>Starting level</b><small>The panel toggle overrides this per game.</small></span><div class="seg">${LVLS.map(([id, n]) => `<button class="${S.level === id ? 'on' : ''}" onclick="set({level:'${id}'})">${n.replace(' only', '')}</button>`).join('')}</div></div>
      <div class="row"><span><b>Tournament games</b><small>Games on a tournament account during the tournament.</small></span><select class="sel"><option>Info only</option><option>Ask each time</option><option>No change</option></select></div>
      <div class="row"><span><b>Proactive Alerts</b><small>Tactical warnings when danger rises. Info-level facts always show.</small></span>${tg('alerts')}</div>` },
  { id: 'models', icon: '✦', col: '#74b9ff', t: 'Models and keys', sum: () => 'Anthropic · Haiku / Sonnet', body: () => `
      <div class="slot"><div class="sh"><b>Quick Model</b><span class="tiny muted">everyday advice and questions</span></div><div class="grid">
        <span>Provider</span><select class="sel"><option>Anthropic</option><option>OpenAI</option><option>OpenRouter</option><option>Ollama (experimental)</option><option>llama-server (experimental)</option><option>Other OpenAI-compatible…</option></select>
        <span>Model</span><select class="sel"><option>claude-haiku-5-5</option></select>
        <span>Thinking</span><div class="seg"><button class="on">Off</button><button>Adaptive</button></div></div></div>
      <div class="slot"><div class="sh"><b>Deep Model</b><span class="tiny muted">only when you tick “Think deeper”</span></div><div class="grid">
        <span>Provider</span><select class="sel"><option>Anthropic</option></select>
        <span>Model</span><select class="sel"><option>claude-sonnet-5-5</option></select>
        <span>Thinking</span><div class="seg"><button>Off</button><button class="on">Adaptive · medium</button></div></div></div>
      <div class="lbl" style="margin-top:14px">API keys</div>
      <div class="keyrow"><span><b class="small">Anthropic</b> <span class="mono">sk-ant-…a1b2</span> <span class="tiny muted">keychain</span></span><span style="display:flex;gap:4px"><button class="btn">Test</button><button class="btn">Replace</button><button class="btn dz">Remove</button></span></div>
      <div class="keyrow"><span><b class="small">OpenAI</b> <span class="tiny muted">from OPENAI_API_KEY in your environment</span></span><span><button class="btn">Test</button></span></div>
      <div class="keyrow"><span><b class="small">Ollama</b> <span class="tiny muted">no key needed · localhost:11434</span></span><span><button class="btn">Test</button></span></div>
      <div class="acts"><button class="btn">+ Add provider</button></div>` },
  { id: 'cost', icon: '$', col: '#2ed573', t: 'Budget and cost', sum: () => `$${S.budget.toFixed(2)} per game · $3.12 this month`, body: () => `
      <div class="tot"><div><b>$0.63</b>this game<div class="meter" style="margin:4px 0 0"><i style="width:63%"></i><b style="left:80%"></b></div></div><div><b>$0.71</b>today</div><div><b>$3.12</b>October</div></div>
      ${budgetPicker()}
      <div class="row"><span><b>Top up this game</b><small>Adds one more budget. You're at $0.63 of $1.00.</small></span><button class="btn">+ $${S.budget.toFixed(2)}</button></div>
      <div class="row"><span><b>Monthly cap</b><small>Hard stop across all games. Off by default.</small></span><span style="display:flex;gap:6px;align-items:center"><input class="fld" style="width:70px;padding:4px 8px" placeholder="$ off"></span></div>
      <div class="row"><span><b>Prices</b><small>From the bundled price table (updated Oct 9). Override if your rates differ.</small></span><button class="btn">Edit prices</button></div>` },
  { id: 'data', icon: '▤', col: '#ffd166', t: 'History and Recordings', sum: () => `${S.prune ? 'Prune after 90 days' : 'Keep forever'} · Recording ${S.rec ? 'on' : 'off'}`, body: () => `
      <div class="row"><span><b>Remove finished games after</b><small>214 games stored · 38 MB</small></span><span style="display:flex;gap:6px;align-items:center"><select class="sel" ${S.prune ? '' : 'disabled'}><option>90 days</option><option>30 days</option><option>1 year</option></select>${tg('prune')}</span></div>
      <div class="row"><span><b>Clear history</b><small>Deletes every stored game and Run Plan. Keeps settings and keys.</small></span><button class="btn dz">Clear history…</button></div>
      <div class="row"><span><b>Record my games</b><small>Saves the raw game stream to replay a problem. Stays on this computer.</small></span>${tg('rec')}</div>
      <div class="row"><span><b>Export this game</b><small>A scrubbed file (no chat, no names, no keys) to attach to a bug report.</small></span><button class="btn">Export…</button></div>
      <div class="row"><span><b>Report a problem</b><small>Bundles the export and any local crash file, then opens a GitHub issue for you to attach them to.</small></span><button class="btn">Report…</button></div>` },
  { id: 'conn', icon: '⇄', col: '#fd79a8', t: 'Connection and window', sum: () => 'Chrome · docked right', body: () => `
      <div class="row"><span><b>Chrome</b> <small>profile “Jeff” · extension 1.2.0 · approved Oct 2</small></span><button class="btn dz">Remove</button></div>
      <div class="row"><span><b>Firefox</b> <small>extension 1.2.0 · approved Oct 5</small></span><button class="btn dz">Remove</button></div>
      <div class="row"><span><b>Dock side</b></span><div class="seg"><button>Left</button><button class="on">Right</button></div></div>
      <div class="row"><span><b>Make room</b><small>Shrink the browser so the panel doesn't cover the game.</small></span><button class="tg"></button></div>
      <div class="row"><span><b>Start at login</b></span>${tg('login')}</div>` },
  { id: 'upd', icon: '↻', col: '#9aa0b2', t: 'Updates', sum: () => S.autoUpd ? 'Automatic · up to date' : 'Manual', body: () => `
      <div class="row"><span><b>Check for updates automatically</b><small>App and game data, on launch and every 6 hours. GitHub sees your IP and app version.</small></span>${tg('autoUpd')}</div>
      <div class="row"><span><b>App 1.2.0</b> <small>${S.autoUpd ? 'Checked 2 h ago · up to date' : 'Automatic checks are off'}</small></span><button class="btn">Check now</button></div>
      <div class="row"><span><b>Game data</b><small>0.34.1, 0.33.2, trunk @ a8f3c1e · community stats Oct 12 · data is 2 days old</small></span><span></span></div>` },
  { id: 'privacy', icon: '◎', col: '#2ed573', t: 'Privacy', sum: () => 'What leaves your computer', body: () => `${leavesList('Anthropic')}
      <div class="row" style="margin-top:10px"><span><b>Delete all local data</b><small>History, Recordings, crash files, approved browsers, settings and stored keys. Like a fresh install.</small></span><button class="btn dz">Delete everything…</button></div>` },
  { id: 'about', icon: 'i', col: '#6f7588', t: 'About', sum: () => '1.2.0 · GPL-3.0', body: () => `
      <div class="small">DCSS Copilot 1.2.0 · GPL-3.0-or-later. Monster, spell and item text and several formulas come from Dungeon Crawl Stone Soup, © the DCSS devteam (GPLv2+).</div>
      <div class="acts"><button class="btn">Source on GitHub</button><button class="btn">Licences</button><button class="btn">Report a problem</button></div>` },
];

function settingsA() {
  const sec = SECTIONS.find(x => x.id === S.sec);
  const sheet = sec
    ? `<div class="sheet"><div class="hd"><button class="btn link" onclick="set({sec:null})">‹ Settings</button><span class="sp"></span><b style="font-size:13px">${sec.t}</b><span class="sp"></span><span style="width:70px"></span></div><div class="body rise">${sec.body()}</div></div>`
    : `<div class="sheet"><div class="hd"><b style="font-size:14px">Settings</b><span class="sp"></span><button class="btn link" onclick="set({s:'connect', c:'idle'})">Done</button></div><div class="body">
        ${[['assist', 'models', 'cost'], ['data', 'conn', 'upd'], ['privacy', 'about']].map(g => `<div class="grp">${g.map(id => { const x = SECTIONS.find(s => s.id === id); return `<button class="it" onclick="set({sec:'${id}'})"><i style="background:${x.col}22;color:${x.col}">${x.icon}</i><span>${x.t}<br><small>${x.sum()}</small></span><span></span><span class="chev">›</span></button>`; }).join('')}</div>`).join('')}
      </div></div>`;
  return `<div class="wrap">${browser({ url: '<b>crawl.akrasiac.org</b>:8080/#play-dcss-0.34', title: 'CAO · jrmitch', page: gamePage(), extOn: true })}<div class="P">${sheet}</div></div>`;
}
function settingsB() {
  const sec = SECTIONS.find(x => x.id === (S.sec || 'assist'));
  return `<div class="desk"><div class="ghost">${browser({ url: 'crawl.akrasiac.org:8080', title: 'CAO', page: gamePage() })}</div>
    <div class="win"><div class="tb"><i></i><i></i><i></i><span>DCSS Copilot Settings</span></div><div class="in">
      <div class="side"><div class="brand"><i>D</i>Settings</div>
        <div class="gh">Advice</div>${['assist', 'models', 'cost'].map(sb).join('')}
        <div class="gh">This computer</div>${['data', 'conn', 'upd'].map(sb).join('')}
        <div class="gh">Trust</div>${['privacy', 'about'].map(sb).join('')}
      </div>
      <div class="main rise" key="${sec.id}"><h2>${sec.t}</h2><div style="max-width:600px">${sec.body()}</div></div>
    </div></div></div>`;
  function sb(id) { const x = SECTIONS.find(s => s.id === id); return `<button class="${x.id === sec.id ? 'on' : ''}" onclick="set({sec:'${id}'})"><span style="color:${x.col}">${x.icon}</span><span>${x.t}</span></button>`; }
}
function settingsC() {
  const q = S.q.trim().toLowerCase();
  const hit = (x) => !q || (x.t + ' ' + x.body().replace(/<[^>]+>/g, ' ')).toLowerCase().includes(q);
  const hl = (html) => q ? html.replace(/>([^<]+)</g, (m, t) => '>' + t.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') + '<') : html;
  const shown = SECTIONS.filter(hit);
  return `<div class="wrap">${browser({ url: '<b>crawl.akrasiac.org</b>:8080/#play-dcss-0.34', title: 'CAO · jrmitch', page: gamePage(), extOn: true })}
    <div class="P"><div class="hd"><button class="btn link" onclick="set({s:'connect', c:'idle'})">‹ Back to game</button><span class="sp"></span><b style="font-size:13px">Settings</b></div>
    <div class="body" id="cbody">
      <div class="search"><input class="fld" id="q" placeholder="Search settings: “key”, “budget”, “delete”…" value="${S.q}" oninput="S.q=this.value; render(); const e=document.getElementById('q'); e.focus(); e.setSelectionRange(e.value.length,e.value.length)">
        <div class="jump">${shown.map(x => `<button onclick="document.getElementById('sec-${x.id}').scrollIntoView({behavior:'smooth'})">${x.t}</button>`).join('')}</div></div>
      ${shown.map(x => `<div class="sect card" id="sec-${x.id}"><h3>${x.t}</h3>${hl(x.body())}</div>`).join('') || '<div class="muted small">Nothing matches.</div>'}
      <div class="tiny muted">Shortcut: click the cost meter in the panel footer to land on Budget, or a provider chip to land on Models.</div>
    </div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  const root = document.getElementById('root');
  const sc = S.s === 'connect' ? connect()
    : S.s === 'download' ? `<div class="wrap solo">${browser({ url: '<b>dcss-copilot.app</b>', title: 'DCSS Copilot · download', page: downloadPage() })}</div>`
    : S.s === 'onboard' ? ({ A: onboardA, B: onboardB, C: onboardC })[S.v]()
    : ({ A: settingsA, B: settingsB, C: settingsC })[S.v]();
  root.innerHTML = sc;
  const shared = S.s === 'download' || S.s === 'connect';
  document.getElementById('switcher').innerHTML = `
    <button onclick="cycle(-1)">←</button>
    <div class="label">${S.v} · ${VARIANTS[S.v]}${shared ? ' <span style="color:#aaa">(same in all)</span>' : ''}<small>${SCREEN_NAMES[S.s]}${S.s === 'connect' ? ' · ' + CONN_NAMES[S.c] : ''}</small></div>
    <button onclick="cycle(1)">→</button>
    <button class="scen" onclick="nextScreen()">S · ${SCREEN_NAMES[S.s]}</button>
    ${S.s === 'connect' ? `<button class="cst" onclick="nextConn()">C · next state</button>` : ''}`;
}
window.cycle = (d) => { const k = Object.keys(VARIANTS); set({ v: k[(k.indexOf(S.v) + d + k.length) % k.length], sec: S.v === 'A' ? null : S.sec }); };
window.nextScreen = () => set({ s: SCREENS[(SCREENS.indexOf(S.s) + 1) % SCREENS.length], step: 0, cOnboardDone: false });
window.nextConn = () => set({ c: CONN[(CONN.indexOf(S.c) + 1) % CONN.length] });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 's' || e.key === 'S') nextScreen(); else if ((e.key === 'c' || e.key === 'C') && S.s === 'connect') nextConn();
});
sync(); render();
</script>
</body>
