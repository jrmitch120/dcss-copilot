<!doctype html>
<!--
  PROTOTYPE, throwaway. "Setup and settings screens" (wayfinder ticket #20), round 2.
  A click-through demo of the decisions from round 1 (index.html):
    - first run lives in the docked panel and asks only two things: connect a browser, choose a model (or No LLM for now)
    - "What leaves your computer" is always shown expanded under the model choice, naming the provider
    - assistance level and Game Budget are asked at the first game, beside the header toggle
    - Settings is a two-pane window with search in the sidebar; panel shortcuts open it at a section
    - recognized tournament games are forced to Info only (key T on the First game screen)
    - the download page is on GitHub Pages; "Reload the game page" is allowed on buffer overflow
  ?v=A|B|C varies only the first-run panel (keys: ← / →):  A Checklist · B One at a time · C Conversation
  S cycles screens (download, first run, connecting, first game, settings). C cycles connection states. ↺ restarts.
  Game data and prices are illustrative.
-->

<body>
<div id="root"></div>
<div id="switcher"></div>
<script>
const VARIANTS = { A: 'Checklist', B: 'One at a time', C: 'Conversation' };
const SCREENS = ['download', 'onboard', 'connect', 'game', 'settings'];
const SCREEN_NAMES = { download: 'Download page', onboard: 'First run', connect: 'Connecting', game: 'First game', settings: 'Settings' };
const CONN = ['noext', 'allow', 'idle', 'unlisted', 'joining', 'lost', 'overflow', 'oldext', 'oldapp', 'update', 'noapp'];
const CONN_NAMES = {
  noext: 'App open, no browser yet', allow: 'Allow this browser?', idle: 'Connected, no game', unlisted: 'Unlisted server',
  joining: 'Game found', lost: 'Stream lost', overflow: 'Buffer overflowed', oldext: 'Extension too old',
  oldapp: 'App too old', update: 'Restart to update', noapp: 'App not installed',
};

const P = new URLSearchParams(location.search);
const S = {
  v: VARIANTS[P.get('v')] ? P.get('v') : 'A',

  c: CONN.includes(P.get('c')) ? P.get('c') : 'noext',
  step: 0, os: 'mac', provider: 'anthropic', key: '', keyState: 'empty', keychain: true, unenc: false,
  level: 'hints', sec: P.get('sec'), tourney: P.get('t') === '1', hintDone: false, obOpen: null, q: '', allowed: false, budget: 1, autoUpd: true, rec: false, prune: true, envKey: false,
  login: false, cOnboardDone: false, alerts: true,
};
const sync = () => { const u = new URL(location); u.searchParams.set('v', S.v); u.searchParams.set('s', S.s); if (S.s === 'connect') u.searchParams.set('c', S.c); else u.searchParams.delete('c'); history.replaceState(null, '', u); };
const set = (patch) => { Object.assign(S, patch); sync(); render(); };
window.set = set;

/* ---------- shared bits ---------- */
const PROVIDERS = [
  { id: 'anthropic', name: 'Anthropic', sub: 'Claude Haiku 5.5 for everyday advice, Sonnet 5.5 for “Think deeper”', tag: ['rec', 'Recommended'], key: true, est: '≈ $0.40 per long game' },
  { id: 'openai', name: 'OpenAI', sub: 'Any chat model your key can use', key: true, est: 'cost varies by model' },
  { id: 'openrouter', name: 'OpenRouter', sub: 'One key, many providers', key: true, est: 'cost varies by model' },
  { id: 'ollama', name: 'Ollama on this computer', sub: 'Runs locally. Slower (5–12 s), quality varies', tag: ['exp', 'Experimental · $0'], key: false, est: '$0' },
  { id: 'none', name: 'No LLM for now', sub: 'Info only: computed facts, Ways Out, Threat Level. Nothing is sent anywhere', tag: ['free', '$0'], key: false, est: '$0' },
];
const prov = () => PROVIDERS.find(p => p.id === S.provider);

function providerChoices(compact) {
  return `<div class="choices">${PROVIDERS.filter(p => !compact || p.id !== 'openrouter').map(p => `
    <button class="choice ${S.provider === p.id ? 'on' : ''}" onclick="set({provider:'${p.id}', keyState:'empty', key:''})">
      <span class="rd"></span><span><b>${p.name}</b><small>${p.sub}</small></span>${p.tag ? `<span class="tagx ${p.tag[0]}">${p.tag[1]}</span>` : '<span></span>'}
    </button>`).join('')}</div>`;
}

function keyEntry() {
  const p = prov();
  if (S.provider === 'none') return `<div class="card small muted">You can add a key any time from the panel or Settings. The Advisor runs fully without one; it just won't give nudges or verdicts, and the ask box answers from facts only.</div>`;
  if (S.provider === 'ollama') return `<div class="card small">
      <div class="lbl">Local model <em>Ollama at localhost:11434</em></div>
      <div class="row"><span><b>Ollama is running</b><small class="ok">✓ Found qwen3:8b, llama3.2:3b</small></span><select class="sel"><option>qwen3:8b</option><option>llama3.2:3b</option></select></div>
      <div class="tiny muted" style="margin-top:6px">Context is set to 16k for you (Ollama's 4k default cuts prompts off). Local advice is experimental: slow answers are dropped once the game has moved on.</div></div>`;
  const ks = S.keyState;
  return `<div class="card">
    <div class="lbl">${p.name} API key <em><a href="#" onclick="return false">Where do I get one?</a></em></div>
    ${S.envKey && ks === 'empty' ? `<div class="keyrow"><span class="small">Found <span class="mono">ANTHROPIC_API_KEY</span> in your environment</span><button class="btn pri" onclick="set({keyState:'ok', key:'env'})">Use it</button></div><div class="tiny muted" style="margin:6px 0">or paste a different key</div>` : ''}
    ${ks === 'ok' ? `<div class="keyrow"><span><span class="mono">sk-ant-…a1b2</span> <span class="ok small">✓ Works · Haiku answered in 0.9 s</span></span><button class="btn" onclick="set({keyState:'empty'})">Replace</button></div>`
      : `<div style="display:flex;gap:6px"><input class="fld mono" placeholder="sk-ant-…" value="${S.key}" oninput="S.key=this.value"><button class="btn pri" onclick="set({keyState: S.key ? 'testing' : 'empty'}); setTimeout(()=>set({keyState: S.key.length > 6 ? 'ok' : 'bad'}), 900)">${ks === 'testing' ? '<span class="spin"></span>' : 'Test'}</button></div>`}
    ${ks === 'bad' ? `<div class="no small" style="margin-top:6px">✕ ${p.name} rejected that key (401). Check it was copied in full.</div>` : ''}
    <div class="tiny muted" style="margin-top:8px">${S.keychain
      ? '🔒 Stored in your system keychain. Never written to logs, Recordings or crash files.'
      : `<span class="am">⚠ No system keychain found.</span> The key is kept in memory for this session and asked for again next launch.
         <label style="display:flex;gap:6px;align-items:center;margin-top:6px;color:#c9cdd8"><input type="checkbox" ${S.unenc ? 'checked' : ''} onchange="set({unenc:this.checked})"> Store unencrypted on this computer</label>
         ${S.unenc ? '<div class="warnline">Saved to a file only your user can read. Anyone with access to your account can read the key.</div>' : ''}`}
    </div>
    <div class="tiny muted" style="margin-top:4px">Estimated cost on default settings: ${p.est}. You set a per-game budget next.</div>
  </div>`;
}

function leavesList(provName) {
  const pn = provName || (S.provider === 'none' ? 'your LLM provider' : prov().name);
  return `<div class="leaves">
    <div class="lv"><i>✦</i><span><b>Advice requests → ${pn}</b>A summary of your game (stats, monsters, items, map facts; no chat, no names) goes to ${pn} using your key, plus anything you type in the ask box, as typed. Their privacy terms apply. Info only sends nothing.</span></div>
    <div class="lv"><i>↻</i><span><b>Update checks → GitHub</b>On launch and every 6 hours. GitHub sees your IP address and app version. You can turn this off.</span></div>
    <div class="lv"><i>⧉</i><span><b>Extension updates → your browser's store</b>Handled by the browser, not by us.</span></div>
    <div class="lv"><i>👁</i><span><b>Spectating</b>The same summary of the game you're watching goes to ${pn}. It isn't saved.</span></div>
  </div>
  <div class="never">Nothing else. No telemetry, no crash reports, no usage stats, ever. Recordings and history stay on this computer unless you export them. The extension only relays game messages, only to this app.</div>`;
}

const LVLS = [
  ['info', 'Info only', 'Facts, no LLM', 'Ogre: 2 hits to kill you. Ways Out: ✓ stairs (3), ✓ blink 4%.'],
  ['hints', 'Hints', 'Facts plus a nudge', '“Back up to the corridor first.” Plus all of Info.'],
  ['coach', 'Coach', 'A verdict and why', '“Fight it in the corridor: 1-on-1 you win 97% and the yaks can’t flank.”'],
];
function levelTiles() {
  return `<div class="lvls">${LVLS.map(([id, n, s, eg]) => `<button class="lvl ${S.level === id ? 'on' : ''}" onclick="set({level:'${id}'})"><b>${n}</b><small>${s}</small><div class="eg">${eg}</div></button>`).join('')}</div>
  <div class="tiny muted" style="margin-top:6px">You can switch any time from the panel header. Recognized tournament games are always Info only.</div>`;
}

function budgetPicker() {
  return `<div class="row" style="border:0"><span><b>Game Budget</b><small>Most to spend on advice per game. At 80% you get a warning; at 100% the Advisor Steps Down instead of going quiet. You can top up mid-run.</small></span>
    <div class="seg">${[0.5, 1, 2, 5].map(b => `<button class="${S.budget === b ? 'on' : ''}" onclick="set({budget:${b}})">$${b}</button>`).join('')}</div></div>`;
}

function extStatus(compact) {
  if (S.allowed) return `<div class="card good small"><b class="ok">✓ Chrome is connected</b> <span class="muted">· extension 1.2.0 · relay protocol v3</span></div>`;
  return `<div class="card">
    <div class="lbl">Browser extension <em class="pulse">waiting for a browser…</em></div>
    <div class="small muted" style="margin-bottom:8px">The extension reads the webtiles game in your browser and passes it to this app. It never presses keys.</div>
    <div class="acts" style="margin-top:0"><button class="btn">Chrome Web Store</button><button class="btn">Firefox Add-ons</button><button class="btn">Edge Add-ons</button></div>
    <button class="btn link tiny" style="margin-top:6px" onclick="set({c:'allow'}); ${compact ? '' : ''} demoAllow()">(prototype: simulate the extension connecting)</button>
  </div>`;
}
window.demoAllow = () => { S._askAllow = true; render(); };
function allowCard() {
  return `<div class="card warn rise">
    <div class="lbl">New connection</div>
    <h4>Allow this browser?</h4>

    <div class="acts"><button class="btn pri" onclick="S._askAllow=false; set({allowed:true})">Allow</button><button class="btn" onclick="S._askAllow=false; render()">Don't allow</button></div>
  </div>`;
}

/* ---------- browser pane ---------- */
function browser({ url, title, page, popup, extOn, badge }) {
  return `<div class="br">
    <div class="tabs"><div class="tab">${title}</div><div class="tab" style="background:none">+</div></div>
    <div class="bar"><span class="muted">←  →  ↻</span><div class="url">${url}</div><div class="ext ${extOn ? 'on' : ''}" title="DCSS Copilot">DC${badge ? '<span class="badge"></span>' : ''}</div></div>
    <div class="page">${page}</div>${popup || ''}
  </div>`;
}

const lobbyPage = (host) => `<div class="lobby"><h2>${host}: Dungeon Crawl Stone Soup</h2>Logged in as <b>jrmitch</b>.
  <div><span class="play">Play 0.34</span><span class="play">Play trunk</span><span class="play">Play Sprint</span></div>

  <tr><td>wizzle</td><td>trunk</td><td>22</td><td>DsCj</td><td>Zot:2</td><td>0:00</td></tr></table></div>`;

function downloadShell(hero, os) {

    <div class="osbar">${['mac', 'win', 'linux'].map(o => `<button class="${os === o ? 'on' : ''}" onclick="set({os:'${o}'})">${{ mac: 'macOS', win: 'Windows', linux: 'Linux' }[o]}</button>`).join('')}</div>
    <h1>A second pair of eyes for <span>Crawl</span>.</h1>

/* ---------- first run: the two required things, in the docked panel ---------- */
const modelDone = () => S.keyState === 'ok' || ['none', 'ollama'].includes(S.provider);
const ready = () => S.allowed && modelDone();
function privacyBlock() {
  if (S.provider === 'none') return `<div class="never">Info only sends nothing anywhere. Only update checks go out (to GitHub), and you can turn those off in Settings.</div>`;
  return `<div class="card"><div class="lbl">What leaves your computer <em>read once</em></div>${leavesList()}</div>`;
}
const toggles = () => `<div><button class="btn link tiny" onclick="set({keychain: !S.keychain})">(prototype: toggle no keychain)</button><button class="btn link tiny" onclick="set({envKey: !S.envKey, keyState:'empty'})">(prototype: toggle env var)</button></div>`;
function obBrowser() {
  return S.allowed
    ? browser({ url: '<b>crawl.akrasiac.org</b>:8080', title: 'CAO', page: lobbyPage('CAO'), extOn: true })
    : browser({ url: '<b>dcss-copilot.github.io</b>/welcome', title: 'Welcome · DCSS Copilot', page: downloadShell(`<div class="lbl ok">✓ App installed</div><div class="small">It's open beside this window. Next, add the browser extension: <a href="#">Chrome</a> · <a href="#">Firefox</a> · <a href="#">Edge</a></div>`, S.os) });
}
function obFoot() {
  return `<div style="display:flex;gap:8px;padding:10px 14px 16px;border-top:1px solid rgba(255,255,255,.06);align-items:center">
    <span class="tiny muted" style="flex:1">${ready() ? 'Ready. Open a game in your browser.' : !S.allowed ? 'Waiting for your browser' : 'Choose a model, or No LLM for now'}</span>
    <button class="btn ${ready() ? 'pri' : ''}" onclick="set({s:'game', hintDone:false})">${ready() ? 'Done' : 'Finish later'}</button></div>`;
}
const obHead = () => `<div class="hd"><span class="dot ${ready() ? 'g' : 'y'}"></span><span class="who"><b>DCSS Copilot</b> · setup</span><span class="sp"></span><button class="ic" onclick="set({s:'settings'})">⚙</button></div>`;

// A: both sections visible and numbered
function onboardA() {
  return `<div class="wrap">${obBrowser()}<div class="P">${obHead()}<div class="body">
    <div style="padding:6px 2px 4px"><h4 style="font-size:20px;letter-spacing:-.01em">Two things and you're playing.</h4><div class="small muted">Everything else has a sensible default and can wait.</div></div>
    <div class="lbl" style="margin:4px 0 -2px">1 · Browser ${S.allowed ? '<span class="ok">✓</span>' : ''}</div>
    ${S._askAllow ? allowCard() : extStatus()}
    <div class="lbl" style="margin:4px 0 -2px">2 · AI model ${modelDone() ? '<span class="ok">✓</span>' : ''}</div>
    ${providerChoices(true)}${keyEntry()}${toggles()}
    ${privacyBlock()}
  </div>${obFoot()}</div></div>`;
}

// B: one section open at a time; finished ones fold to a ✓ line
function onboardB() {
  const open = S.obOpen || (!S.allowed ? 'browser' : !modelDone() ? 'model' : 'privacy');
  const line = (id, label, val) => `<button class="card" style="display:flex;gap:10px;align-items:center;text-align:left;padding:10px 14px" onclick="set({obOpen:'${id}'})"><span class="ok">✓</span><span style="flex:1"><b class="small">${label}</b> <span class="muted small">${val}</span></span><span class="tiny muted">Change</span></button>`;
  const shut = (id, n, label) => `<button class="card" style="display:flex;gap:10px;align-items:center;text-align:left;padding:10px 14px;opacity:.55" onclick="set({obOpen:'${id}'})"><span class="muted">${n}</span><b class="small" style="flex:1">${label}</b><span class="tiny muted">${id === 'model' && !S.allowed ? 'Do this first' : ''}</span></button>`;
  const head = (n, t, sub) => `<div style="padding:2px"><div class="lbl">Step ${n} of 3</div><h4 style="font-size:18px">${t}</h4><div class="small muted">${sub}</div></div>`;
  const sec = {
    browser: open === 'browser' ? `<div class="rise" style="display:flex;flex-direction:column;gap:10px">${head(1, 'Connect your browser', 'The extension passes your webtiles game to this app. It never presses keys.')}${S._askAllow ? allowCard() : extStatus()}</div>`
      : S.allowed ? line('browser', 'Browser', 'Chrome connected') : shut('browser', 1, 'Connect your browser'),
    model: open === 'model' ? `<div class="rise" style="display:flex;flex-direction:column;gap:10px">${head(2, 'Choose an AI model', 'Your own key, billed by the provider. Or skip it and use Info only.')}${providerChoices(true)}${keyEntry()}${toggles()}</div>`
      : modelDone() ? line('model', 'Model', S.provider === 'none' ? 'No LLM · Info only' : prov().name + (S.keyState === 'ok' ? ' · key works' : '')) : shut('model', 2, 'Choose an AI model'),
    privacy: open === 'privacy' ? `<div class="rise" style="display:flex;flex-direction:column;gap:10px">${head(3, 'What leaves your computer', 'Read once. The same text is in Settings → Privacy.')}${privacyBlock()}</div>`
      : shut('privacy', 3, 'What leaves your computer'),
  };
  return `<div class="wrap">${obBrowser()}<div class="P">${obHead()}<div class="body">${sec.browser}${sec.model}${sec.privacy}</div>${obFoot()}</div></div>`;
}

// C: the Advisor talks you through it, in the same place the ask box lives
function onboardC() {
  const me = (t) => `<div class="rise" style="align-self:flex-end;max-width:80%;background:rgba(116,185,255,.16);border:1px solid rgba(116,185,255,.3);padding:7px 11px;border-radius:12px 12px 4px 12px;font-size:12.5px">${t}</div>`;
  const ad = (t) => `<div class="rise" style="display:flex;gap:8px;align-items:flex-start;max-width:92%"><span style="flex:none;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#ffd166,#ff8f5a);color:#111;font:900 12px system-ui;display:grid;place-items:center">D</span><div style="font-size:13px">${t}</div></div>`;
  const chips = `<div style="display:flex;flex-wrap:wrap;gap:6px">${PROVIDERS.filter(p => p.id !== 'openrouter').map(p => `<button class="btn ${S.provider === p.id ? 'pri' : ''}" onclick="set({provider:'${p.id}', keyState:'empty', key:''})">${p.name}${p.tag ? ` <span class="tiny" style="opacity:.7">· ${p.tag[1]}</span>` : ''}</button>`).join('')}</div>`;
  let m = [ad(`Hi. I'm your Advisor: I watch your game and tell you what I see. I never press a key. Two things and we're playing.`),
           ad(`First, your browser. Add the extension where you play, and I'll ask you to approve it.`),
           S._askAllow ? allowCard() : S.allowed ? me('✓ Chrome connected') : extStatus()];
  if (S.allowed || S.obSkipBrowser) {
    m.push(ad(`Now, who should I think with? Bring your own key; the provider bills you directly. Or skip it, and I'll stick to facts.`), chips);
    if (!modelDone() || S.provider === 'anthropic' && S.keyState !== 'ok') m.push(keyEntry(), toggles());
    else if (S.provider === 'ollama') m.push(keyEntry());
    if (modelDone()) {
      m.push(me(S.provider === 'none' ? 'No LLM for now' : `${prov().name}${S.keyState === 'ok' ? ' · key works' : ''}`));
      m.push(ad(S.provider === 'none' ? `Fine. Info only sends nothing anywhere.` : `Here's exactly what leaves your computer, once, so there are no surprises:`));
      if (S.provider !== 'none') m.push(`<div class="card rise">${leavesList()}</div>`);
      m.push(ad(`That's it. Open a game and I'll meet you there.`));
    }
  } else m.push(`<button class="btn link tiny" style="align-self:flex-start" onclick="set({obSkipBrowser:true})">Skip ahead to the model</button>`);
  return `<div class="wrap">${obBrowser()}<div class="P">${obHead()}<div class="body" style="gap:12px">${m.join('')}</div>${obFoot()}</div></div>`;
}

/* ---------- first game: assistance level and budget, asked where the toggle lives ---------- */

        <div class="acts"><button class="btn pri" onclick="set({hintDone:true})">Got it</button></div></div>`;
  const spent = llm ? 0.04 : 0;
  return `<div class="wrap">${browser({ url: '<b>crawl.akrasiac.org</b>:8080/#play-dcss-0.34', title: 'CAO · jrmitch', page: gamePage(), extOn: true })}

      <div class="card" style="opacity:.5;height:120px"><div class="lbl">Run Plan</div><div class="small muted">Planned at the first All Clear.</div></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;padding:8px 14px 14px;border-top:1px solid rgba(255,255,255,.06)">
      <input class="fld" placeholder="${t ? 'Look something up: “what does an ogre do?”' : 'Ask the Advisor…'}" style="flex:1">
      ${llm ? `<button class="btn" title="Opens Settings → Budget and cost" onclick="set({s:'settings', sec:'cost'})">$${spent.toFixed(2)} of $${S.budget.toFixed(2)}</button>` : `<button class="btn" title="Opens Settings → Models" onclick="set({s:'settings', sec:'models'})">${t ? 'Info only' : 'No LLM'}</button>`}
    </div></div></div>`;

/* ---------- connection states (shared) ---------- */
function connect() {
  const c = S.c;
  const host = c === 'unlisted' ? '<b>crawl.mydomain.net</b>' : '<b>crawl.akrasiac.org</b>:8080';
  const inGame = ['joining', 'lost', 'overflow', 'oldext', 'oldapp', 'unlisted'].includes(c);
  let popup = '', badge = false, panel = '', solo = false;
  const hd = (dot, who, extra = '') => `<div class="hd"><span class="dot ${dot}"></span><span class="who">${who}</span><span class="sp"></span>${extra}<button class="ic" onclick="set({s:'settings'})">⚙</button></div>`;
  const ghostPanel = `<div class="card" style="opacity:.35"><div class="lbl">Now</div>CALM · Lair:2, nothing in view.</div><div class="card" style="opacity:.25;height:160px"></div>`;

  switch (c) {
    case 'noext': panel = `${hd('', '<b>DCSS Copilot</b>')}<div class="body">${extStatus()}<div class="small muted">Waiting for a browser. You can close this window; DCSS Copilot stays in the tray and pops up when a game starts.</div></div>`; break;
    case 'allow': panel = `${hd('y', '<b>DCSS Copilot</b>')}<div class="body">${allowCard()}<div class="tiny muted">Approved browsers are listed in Settings → Connection, where you can remove them.</div></div>`; break;
    case 'idle': panel = `${hd('g', '<b>DCSS Copilot</b> · Chrome connected')}<div class="body">
        <div class="card"><div class="lbl">Ready <em>waiting for a game</em></div><div class="small">Start or resume a game in Chrome and the panel takes over. To watch someone, open their game as a spectator.</div></div>
        <div class="card"><div class="lbl">Recent games</div>
          <div class="row"><span><b>Jrmitch the MiFi</b><small>CAO · 0.34.1 · Lair:2 · T 18,402 · 2 h ago</small></span><button class="btn">Resume on CAO ↗</button></div>
          <div class="row"><span><b>Jrmitch the DsCj</b><small>CBRO · trunk · died on D:9 · yesterday</small></span><span class="tiny muted">ended</span></div></div>
        <div class="tiny muted">Game Knowledge: 0.34.1 ✓ · 0.33.2 ✓ · trunk (fetched on first trunk game)</div></div>`; break;
    case 'joining': panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2')}<div class="body">
        <div class="card rise"><div class="lbl">Joining <em><span class="spin"></span></em></div>
          <div class="small" style="display:grid;gap:4px">
            <div class="ok">✓ CAO · webtiles · you're playing (not spectating)</div>
            <div class="ok">✓ Crawl 0.34.1 · Game Knowledge exact match</div>
            <div class="ok">✓ Resumed: game from 2 h ago (T 18,402 → 18,405)</div>
            <div class="pulse">… reading the map and inventory</div></div></div>
        <div class="tiny muted">The join card asking for <span class="mono">?#</span> and the Gaps chip are designed in “In-game secondary surfaces”.</div>${ghostPanel}</div>`; break;
    case 'lost': panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2', '<span class="tagx exp">reconnecting</span>')}<div class="body">
        <div class="card warn"><div class="lbl">Lost the game stream <em><span class="spin"></span> retrying</em></div><div class="small">The game tab closed or the connection dropped. Everything below is from <b>T 18,511</b> and frozen until the game comes back.</div>
          <div class="acts"><button class="btn">Show the game tab</button><button class="btn link">This game is over</button></div></div>${ghostPanel}</div>`; break;
    case 'overflow': panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2')}<div class="body">
        <div class="card warn"><div class="lbl">Missed part of the game</div><div class="small">The app was away long enough that the browser dropped some messages. Reload the game page (F5) to resync. Crawl saves and restores your game; nothing is lost.</div>
          <div class="acts"><button class="btn pri">Reload the game page</button></div><div class="tiny muted" style="margin-top:6px">This button asks the extension to reload the tab. It never sends keys to the game.</div></div>${ghostPanel}</div>`; break;
    case 'oldext': panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2')}<div class="body">
        <div class="card warn"><div class="lbl">Update the extension</div><div class="small">Your extension (1.0.4, relay v1) is older than this app understands (v2–v3). Browsers usually update it within a few hours.</div>
          <div class="acts"><button class="btn pri">Open chrome://extensions</button><button class="btn link">How to update now</button></div></div>${ghostPanel}</div>`; break;
    case 'oldapp': badge = true; popup = `<div class="popup rise"><h5><i>DC</i>DCSS Copilot</h5><div class="st">This extension is newer than your app. <b>Update the app</b> to keep advice running.</div><button class="btn pri" style="width:100%">Update the app</button></div>`;
      panel = `${hd('y', '<b>Jrmitch</b> the MiFi · Lair:2')}<div class="body">
        <div class="card warn"><div class="lbl">Update the app <em><span class="spin"></span> downloading 62%</em></div><div class="small">Your extension speaks a newer relay protocol (v4). The update downloads now; restart once you're out of this game.</div>
          <div class="meter"><i style="width:62%"></i></div><div class="acts"><button class="btn">Restart now (saves your game first)</button></div></div>${ghostPanel}</div>`; break;
    case 'update': panel = `${hd('g', '<b>DCSS Copilot</b> · Chrome connected')}<div class="body">
        <div class="card"><div class="lbl">Ready <em>waiting for a game</em></div><div class="small muted">Start or resume a game in Chrome.</div></div></div>
        <div class="toast rise"><span>⬆</span><span><b>Version 1.3 is ready.</b><span class="muted small"> Better Ways Out for Lair.</span></span><span class="sp"></span><button class="btn pri">Restart to update</button><button class="btn link">Later</button></div>`; break;
    case 'unlisted': badge = true; popup = `<div class="popup rise"><h5><i>DC</i>DCSS Copilot</h5><div class="st"><b>crawl.mydomain.net</b> isn't a server we know. Let the extension read webtiles games on this site?</div>
        <button class="btn pri" style="width:100%">Enable on this site</button><div class="tiny muted" style="margin-top:8px">Your browser will ask to confirm. Only the game connection is read.</div></div>`;
      panel = `${hd('g', '<b>DCSS Copilot</b> · Chrome connected')}<div class="body"><div class="card"><div class="lbl">Ready <em>waiting for a game</em></div><div class="small muted">Playing on a private or local server? Click the extension icon and choose Enable on this site.</div></div></div>`; break;
    case 'noapp': solo = true; badge = false;
      popup = `<div class="popup rise"><h5><i>DC</i>DCSS Copilot</h5><div class="st">Couldn't reach the DCSS Copilot app on this computer.</div>
        <button class="btn pri" style="width:100%">Get DCSS Copilot</button><button class="btn link tiny" style="width:100%;margin-top:4px">It's installed: try again</button></div>`; break;
  }
  if (c !== 'noapp' && !popup && ['idle', 'joining', 'lost'].includes(c) === false && c !== 'update') { }
  const br = browser({ url: host + (inGame ? '/#play-dcss-0.34' : ''), title: inGame ? 'CAO · jrmitch' : 'CAO', page: c === 'lost' ? lobbyPage('CAO') : inGame ? gamePage() : lobbyPage('CAO'), popup, extOn: !['noext', 'noapp'].includes(c), badge });
  if (solo) return `<div class="wrap solo">${br}</div>`;
  return `<div class="wrap">${br}<div class="P">${panel}</div></div>`;
}

/* ---------- settings content (shared data, three presentations) ---------- */

const SECTIONS = [
  { id: 'assist', icon: '◐', col: '#a29bfe', t: 'Assistance', sum: () => ({ info: 'Info only', hints: 'Hints', coach: 'Coach' })[S.level], body: () => `
      <div class="row"><span><b>Starting level</b><small>The panel toggle overrides this per game.</small></span><div class="seg">${LVLS.map(([id, n]) => `<button class="${S.level === id ? 'on' : ''}" onclick="set({level:'${id}'})">${n.replace(' only', '')}</button>`).join('')}</div></div>
      <div class="row"><span><b>Tournament games</b><small>Games that count for the official tournament: its version, on an official server, inside its dates. Dates come with game data.</small></span><select class="sel"><span class="tagx exp">Always Info only</span></div>
      <div class="row"><span><b>Proactive Alerts</b><small>Tactical warnings when danger rises. Info-level facts always show.</small></span>${tg('alerts')}</div>` },
  { id: 'models', icon: '✦', col: '#74b9ff', t: 'Models and keys', sum: () => 'Anthropic · Haiku / Sonnet', body: () => `
      <div class="slot"><div class="sh"><b>Quick Model</b><span class="tiny muted">everyday advice and questions</span></div><div class="grid">
        <span>Provider</span><select class="sel"><option>Anthropic</option><option>OpenAI</option><option>OpenRouter</option><option>Ollama (experimental)</option><option>llama-server (experimental)</option><option>Other OpenAI-compatible…</option></select>
        <span>Model</span><select class="sel"><option>claude-haiku-5-5</option></select>
        <span>Thinking</span><div class="seg"><button class="on">Off</button><button>Adaptive</button></div></div></div>
      <div class="slot"><div class="sh"><b>Deep Model</b><span class="tiny muted">only when you tick “Think deeper”</span></div><div class="grid">
        <span>Provider</span><select class="sel"><option>Anthropic</option></select>

      <div class="keyrow"><span><b class="small">OpenAI</b> <span class="tiny muted">from OPENAI_API_KEY in your environment</span></span><span><button class="btn">Test</button></span></div>
      <div class="keyrow"><span><b class="small">Ollama</b> <span class="tiny muted">no key needed · localhost:11434</span></span><span><button class="btn">Test</button></span></div>
      <div class="acts"><button class="btn">+ Add provider</button></div>` },
  { id: 'cost', icon: '$', col: '#2ed573', t: 'Budget and cost', sum: () => `$${S.budget.toFixed(2)} per game · $3.12 this month`, body: () => `
      <div class="tot"><div><b>$0.63</b>this game<div class="meter" style="margin:4px 0 0"><i style="width:63%"></i><b style="left:80%"></b></div></div><div><b>$0.71</b>today</div><div><b>$3.12</b>October</div></div>
      ${budgetPicker()}
      <div class="row"><span><b>Top up this game</b><small>Adds one more budget. You're at $0.63 of $1.00.</small></span><button class="btn">+ $${S.budget.toFixed(2)}</button></div>
      <div class="row"><span><b>Monthly cap</b><small>Hard stop across all games. Off by default.</small></span><span style="display:flex;gap:6px;align-items:center"><input class="fld" style="width:70px;padding:4px 8px" placeholder="$ off"></span></div>
      <div class="row"><span><b>Prices</b><small>From the bundled price table (updated Oct 9). Override if your rates differ.</small></span><button class="btn">Edit prices</button></div>` },
  { id: 'data', icon: '▤', col: '#ffd166', t: 'History and Recordings', sum: () => `${S.prune ? 'Prune after 90 days' : 'Keep forever'} · Recording ${S.rec ? 'on' : 'off'}`, body: () => `
      <div class="row"><span><b>Remove finished games after</b><small>214 games stored · 38 MB</small></span><span style="display:flex;gap:6px;align-items:center"><select class="sel" ${S.prune ? '' : 'disabled'}><option>90 days</option><option>30 days</option><option>1 year</option></select>${tg('prune')}</span></div>
      <div class="row"><span><b>Clear history</b><small>Deletes every stored game and Run Plan. Keeps settings and keys.</small></span><button class="btn dz">Clear history…</button></div>
      <div class="row"><span><b>Record my games</b><small>Saves the raw game stream to replay a problem. Stays on this computer.</small></span>${tg('rec')}</div>
      <div class="row"><span><b>Export this game</b><small>A scrubbed file (no chat, no names, no keys) to attach to a bug report.</small></span><button class="btn">Export…</button></div>
      <div class="row"><span><b>Report a problem</b><small>Bundles the export and any local crash file, then opens a GitHub issue for you to attach them to.</small></span><button class="btn">Report…</button></div>` },
  { id: 'conn', icon: '⇄', col: '#fd79a8', t: 'Connection and window', sum: () => 'Chrome · docked right', body: () => `
      <div class="row"><span><b>Chrome</b> <small>profile “Jeff” · extension 1.2.0 · approved Oct 2</small></span><button class="btn dz">Remove</button></div>
      <div class="row"><span><b>Firefox</b> <small>extension 1.2.0 · approved Oct 5</small></span><button class="btn dz">Remove</button></div>
      <div class="row"><span><b>Dock side</b></span><div class="seg"><button>Left</button><button class="on">Right</button></div></div>
      <div class="row"><span><b>Make room</b><small>Shrink the browser so the panel doesn't cover the game.</small></span><button class="tg"></button></div>
      <div class="row"><span><b>Start at login</b></span>${tg('login')}</div>` },
  { id: 'upd', icon: '↻', col: '#9aa0b2', t: 'Updates', sum: () => S.autoUpd ? 'Automatic · up to date' : 'Manual', body: () => `
      <div class="row"><span><b>Check for updates automatically</b><small>App and game data, on launch and every 6 hours. GitHub sees your IP and app version.</small></span>${tg('autoUpd')}</div>
      <div class="row"><span><b>App 1.2.0</b> <small>${S.autoUpd ? 'Checked 2 h ago · up to date' : 'Automatic checks are off'}</small></span><button class="btn">Check now</button></div>
      <div class="row"><span><b>Game data</b><small>0.34.1, 0.33.2, trunk @ a8f3c1e · community stats Oct 12 · data is 2 days old</small></span><span></span></div>` },
  { id: 'privacy', icon: '◎', col: '#2ed573', t: 'Privacy', sum: () => 'What leaves your computer', body: () => `${leavesList('Anthropic')}
      <div class="row" style="margin-top:10px"><span><b>Delete all local data</b><small>History, Recordings, crash files, approved browsers, settings and stored keys. Like a fresh install.</small></span><button class="btn dz">Delete everything…</button></div>` },
  { id: 'about', icon: 'i', col: '#6f7588', t: 'About', sum: () => '1.2.0 · GPL-3.0', body: () => `
      <div class="small">DCSS Copilot 1.2.0 · GPL-3.0-or-later. Monster, spell and item text and several formulas come from Dungeon Crawl Stone Soup, © the DCSS devteam (GPLv2+).</div>
      <div class="acts"><button class="btn">Source on GitHub</button><button class="btn">Licences</button><button class="btn">Report a problem</button></div>` },
];

/* ---------- settings: a two-pane window, with search in the sidebar ---------- */
function settings() {
  const q = S.q.trim().toLowerCase();
  const text = (x) => (x.t + ' ' + x.body().replace(/<[^>]+>/g, ' ')).toLowerCase();
  const hl = (html) => q ? html.replace(/>([^<]+)</g, (m, t) => '>' + t.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') + '<') : html;
  const hits = SECTIONS.filter(x => !q || text(x).includes(q));
  const sec = SECTIONS.find(x => x.id === (S.sec || 'assist'));
  const sb = (id) => { const x = SECTIONS.find(s => s.id === id); if (q && !hits.includes(x)) return ''; return `<button class="${!q && x.id === sec.id ? 'on' : ''}" onclick="set({sec:'${id}', q:''})"><span style="color:${x.col}">${x.icon}</span><span>${x.t}</span></button>`; };
  const grp = (h, ids) => { const b = ids.map(sb).join(''); return b ? `<div class="gh">${h}</div>${b}` : ''; };
  const main = q
    ? (hits.map(x => `<div><h3 style="margin-bottom:4px">${x.t}</h3><div style="max-width:600px">${hl(x.body())}</div></div>`).join('') || '<div class="muted">Nothing matches.</div>')
    : `<h2>${sec.t}</h2><div style="max-width:600px">${sec.body()}</div>`;
  return `<div class="desk"><div class="ghost">${browser({ url: 'crawl.akrasiac.org:8080', title: 'CAO', page: gamePage() })}</div>
    <div class="win"><div class="tb"><i></i><i></i><i></i><span>DCSS Copilot Settings</span><button class="btn link tiny" style="position:absolute;right:10px;top:4px" onclick="set({s:'game'})">Close</button></div><div class="in">
      <div class="side">
        <input class="fld" id="q" style="margin-bottom:8px;padding:6px 10px;font-size:12.5px" placeholder="Search: key, budget, delete…" value="${S.q}" oninput="S.q=this.value; render(); const e=document.getElementById('q'); e.focus(); e.setSelectionRange(e.value.length,e.value.length)">
        ${grp('Advice', ['assist', 'models', 'cost'])}${grp('This computer', ['data', 'conn', 'upd'])}${grp('Trust', ['privacy', 'about'])}
      </div>
      <div class="main rise" key="${q || sec.id}">${main}</div>
    </div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  const root = document.getElementById('root');
  root.innerHTML = S.s === 'connect' ? connect()
    : S.s === 'download' ? `<div class="wrap solo">${browser({ url: '<b>dcss-copilot.github.io</b>', title: 'DCSS Copilot · download', page: downloadPage() })}</div>`
    : S.s === 'onboard' ? ({ A: onboardA, B: onboardB, C: onboardC })[S.v]()
    : S.s === 'game' ? firstGame()
    : settings();
  const varies = S.s === 'onboard';
  document.getElementById('switcher').innerHTML = `
    ${varies ? `<button onclick="cycle(-1)">←</button>` : ''}
    <div class="label">${varies ? `${S.v} · ${VARIANTS[S.v]}` : SCREEN_NAMES[S.s]}<small>${varies ? 'First run' : S.s === 'connect' ? CONN_NAMES[S.c] : S.s === 'game' ? (S.tourney ? 'Tournament game' : 'Ordinary game') : 'Decided design'}</small></div>
    ${varies ? `<button onclick="cycle(1)">→</button>` : ''}
    <button class="scen" onclick="nextScreen()">S · next screen</button>
    ${S.s === 'connect' ? `<button class="cst" onclick="nextConn()">C · next state</button>` : ''}
    ${S.s === 'game' ? `<button class="cst" onclick="set({tourney:!S.tourney, hintDone:false})">T · ${S.tourney ? 'ordinary' : 'tournament'}</button>` : ''}
    <button class="scen" title="Start the demo over" onclick="reset()">↺</button>`;
}
window.cycle = (d) => { const k = Object.keys(VARIANTS); set({ v: k[(k.indexOf(S.v) + d + k.length) % k.length], obOpen: null }); };
window.nextScreen = () => set({ s: SCREENS[(SCREENS.indexOf(S.s) + 1) % SCREENS.length], hintDone: false });
window.nextConn = () => set({ c: CONN[(CONN.indexOf(S.c) + 1) % CONN.length] });
window.reset = () => set({ s: 'download', allowed: false, _askAllow: false, provider: 'anthropic', keyState: 'empty', key: '', obOpen: null, obSkipBrowser: false, hintDone: false, tourney: false, sec: null, q: '' });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' && S.s === 'onboard') cycle(-1); else if (e.key === 'ArrowRight' && S.s === 'onboard') cycle(1);
  else if (e.key === 's' || e.key === 'S') nextScreen(); else if ((e.key === 'c' || e.key === 'C') && S.s === 'connect') nextConn();
  else if ((e.key === 't' || e.key === 'T') && S.s === 'game') set({ tourney: !S.tourney, hintDone: false });
});
sync(); render();
</script>
