# Formats staged files and re-stages them. CI runs clippy, tests and the rest.
pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    - name: biome
      glob: "*.{ts,js,json,svelte,html,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
