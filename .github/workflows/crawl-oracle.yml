name: Crawl oracle

# The engine's ported formulas, diffed against crawl's own code at each shipped stable bundle's
# commit (tools/crawl-oracle). Runs whenever the engine, the bundles or the oracle change.
on:
  pull_request:
    paths:
      - crates/core/src/engine/**
      - crates/gk/**
      - tools/crawl-oracle/**
      - .github/workflows/crawl-oracle.yml
  push:
    branches: [main]
    paths:
      - crates/core/src/engine/**
      - crates/gk/**
      - tools/crawl-oracle/**
      - .github/workflows/crawl-oracle.yml
  workflow_dispatch:

concurrency:
  group: crawl-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  oracle:
    name: Crawl oracle (${{ matrix.bundle }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A shard takes about a quarter of a full run's half hour, most of it the monster turn
    # harness, plus crawl's build when it isn't cached; a hung one fails here rather than at
    # GitHub's six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bundle: ["0.34.1"]
        # Each job diffs the cases in its shard (tools/crawl-oracle/oracle.sh). As the engine
        # grows, add shards: every one here must carry the same count.
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v5
      - name: Crawl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncursesw5-dev bison flex libsqlite3-dev libz-dev libpng-dev pkg-config python3-yaml
      - name: The bundle's crawl commit and the runner's OS image
        id: crawl
        run: |
          echo "commit=$(jq -r .crawl.commit crates/gk/bundles/${{ matrix.bundle }}.json)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      # The checkout with crawl's objects, so only the harness is rebuilt. Keyed by the crawl
      # commit and the runner's OS image, whose compiler built the objects; the harness is
      # rebuilt from this repo on every run.
      - name: Cached crawl build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/crawl
          key: crawl-oracle-${{ steps.crawl.outputs.image }}-${{ steps.crawl.outputs.commit }}
      - name: Crawl at the bundle's commit
        run: |
          crawl="$RUNNER_TEMP/crawl"
          if [ ! -d "$crawl" ]; then
            git clone --depth 1 --branch ${{ matrix.bundle }} https://github.com/crawl/crawl "$crawl"
            git -C "$crawl" submodule update --init --depth 1 crawl-ref/source/contrib/lua crawl-ref/source/contrib/pcre crawl-ref/source/contrib/sqlite crawl-ref/source/contrib/zlib
          fi
          test "$(git -C "$crawl" rev-parse HEAD)" = "${{ steps.crawl.outputs.commit }}"
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build crawl
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C "$RUNNER_TEMP/crawl/crawl-ref/source" -f Makefile -f "$PWD/tools/crawl-oracle/harness/oracle.mk" \
            -j"$(nproc)" WEBTILES=y USE_DGAMELAUNCH=y crawl-oracle-objects
      # Saved before the oracle runs, so a run that finds a mismatch doesn't rebuild crawl next time.
      # On a miss every shard builds crawl and the first to finish saves it; the others' saves
      # find the key taken and warn.
      - name: Save the crawl build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/crawl
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - run: tools/crawl-oracle/oracle.sh "$RUNNER_TEMP/crawl" "${{ matrix.shard }}"
