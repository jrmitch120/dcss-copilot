name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Shipped Game Knowledge is what the extractor makes of crawl at its tag
        run: |
          crawl="$RUNNER_TEMP/crawl"
          git clone --depth 1 --branch 0.34.1 --filter=blob:none --sparse https://github.com/crawl/crawl "$crawl"
          git -C "$crawl" sparse-checkout set --no-cone '/crawl-ref/source/*.h' '/crawl-ref/source/*.cc' '/crawl-ref/source/dat/mons/' '/crawl-ref/source/dat/species/' '/crawl-ref/source/dat/descript/'
          test "$(git -C "$crawl" rev-parse HEAD)" = "$(jq -r .crawl.commit crates/gk/bundles/0.34.1.json)"
          DCSS_CRAWL_SOURCE="$crawl" cargo test -p gk-extract -- --ignored
      - name: Generated bindings are up to date
        run: git diff --exit-code -- app/src/lib/bindings.ts
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - name: Extension builds
        run: pnpm --filter @dcss-copilot/extension build && pnpm --filter @dcss-copilot/extension build:firefox

  build-app:
    name: Build app (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Debug: this only checks the app compiles on each OS. Release builds belong to packaging.
      - run: pnpm tauri build --debug --no-bundle
