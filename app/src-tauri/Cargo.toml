[package]
name = "copilot-app"
description = "The DCSS Copilot desktop app: wires the core to its windows, tray and keychain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Distinct from the bin name, which Windows needs (rust-lang/cargo#8519).
name = "copilot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
copilot-core.workspace = true
copilot-llm.workspace = true
copilot-replay.workspace = true
copilot-webtiles.workspace = true
# The relay's localhost websocket server. Tauri already runs on tokio.
futures-util.workspace = true
# Players' API keys, in the OS keychain: Keychain Services, Credential Manager or the Secret Service.
keyring = "4"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { version = "2", features = [] }
tauri-specta.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "rt", "macros", "time"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
